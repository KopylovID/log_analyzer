name: Настройка окружения
description: Установка Python, uv и зависимостей
runs:
  using: composite
  steps:
    - name: Установка Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Установка uv
      run: |
        python -m pip install --upgrade pip
        pip install uv
      shell: bash
    - name: Установка зависимостей
      run: uv sync
      shell: bash